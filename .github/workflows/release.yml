# Release: when scripts/release.sh's v* tag is pushed, builds the image from that tag on a clean
# GitHub machine and creates a draft release with it and its notes. Nothing is public until the
# draft is published on GitHub's Releases page.
#
# The "Run workflow" button in the Actions tab runs it by hand. A dry run, the default, builds and
# shows the notes in the run's summary without creating anything. Run on a tag with dry run
# unticked, it creates the draft, as when a tag push's run failed partway.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and show the notes, but create no release"
        type: boolean
        default: true

# Creating a release needs write access to the repo's contents. Only this workflow has it; the
# build check stays read-only.
permissions:
  contents: write

# Two runs for the same tag would race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A tag push has no inputs, so it publishes; a run by hand publishes only when asked to.
      PUBLISH: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
    steps:
      - name: Check out the code and the SDK
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # all history, for the build number and the commits since the last tag

      # The checkout can leave a tag without its message, which the notes fall back to.
      - name: Fetch the tag with its message
        if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check the tag matches VERSION and is on main
        if: github.ref_type == 'tag'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version). Make releases with scripts/release.sh."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are made from main."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # The same cache as the build check, which a tag's run can read.
      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: PC tests
        run: scripts/check.sh

      # The log is kept because the notes read the version, build and commit from it. Named
      # `shell: bash` runs with pipefail, so a failed build still fails through tee.
      - name: Build the firmware
        shell: bash
        run: scripts/package.sh 2>&1 | tee build.log

      - name: Write the notes
        run: |
          tag=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          scripts/release_notes.py build.log dist/pocketplay-full.bin "$tag" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the image and notes
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/pocketplay-full.bin
            notes.md
          retention-days: 14

      - name: Create the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pocketplay-full.bin \
            --draft --verify-tag \
            --title "PocketPlay ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
          echo "Draft created. Publish it from the Releases page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
