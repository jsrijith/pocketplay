; PocketPlay: games firmware for the Seeed reTerminal Sticky (ESP32-S3).

[platformio]
default_envs = sticky

[env:sticky]
; Same platform release as CrossPlay: Arduino core 3.3.11 on ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
monitor_speed = 115200

; The Sticky has 32MB of flash, wired for DIO. PocketPlay builds for 16MB and uses only the
; first half: two app slots, so OTA updates can be added later, and the coredump area at
; 0xFF0000. That runs normally on the 32MB chip and leaves the rest unused.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -std=gnu++2a
  ; Selects the Sticky's pin map and panel settings in the SDK's BoardConfig.
  -DFREEINK_DEVICE_STICKY=1
  ; The ESP32-S3R8 has 8MB of PSRAM; the framebuffer is allocated there.
  -DBOARD_HAS_PSRAM
  ; USB-C reaches UART0 through a CH343 chip, not the S3's native USB. CDC off
  ; makes Arduino's Serial mean UART0, so logs reach the PC.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; One framebuffer; the panel controller's RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; An SD file closes itself when its variable goes out of scope.
  -DDESTRUCTOR_CLOSES_FILE=1
  ; HTTPS through wolfSSL, the same TLS 1.3 stack CrossPlay uses, because the
  ; precompiled mbedTLS ships TLS 1.3 as empty stubs. The flags below are the part
  ; of CrossPlay's list that downloading needs.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_ALT_CERT_CHAINS
  -DWOLFSSL_SHA384
  -DWOLFSSL_SHA512
  ; Fixed-size P-256 arithmetic: a few KB, where the bignum path needs tens of KB.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI

build_unflags =
  -std=gnu++11

; The gate stops the build unless the PC tests pass. The patch raises wolfSSL's RSA
; size limit to fit real certificate chains. The version script gives the firmware
; VERSION's number, the build and the commit.
extra_scripts =
  pre:scripts/pre_build_gate.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/version.py

lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  ImageToneMapper=symlink://freeink-sdk/libs/assets/ImageToneMapper
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  greiman/SdFat @ 2.3.1
  wolfssl/Arduino-wolfSSL @ 5.7.2
